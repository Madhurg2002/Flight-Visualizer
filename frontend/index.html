<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe3" />
    <title>Skytrace — every flight you have ever taken, on one map</title>
    <script>
      // Resolve the theme before first paint. React cannot do this in time:
      // setting the class from an effect means the page is painted in the
      // default theme first and then swaps, which is a visible flash on every
      // load. An explicit choice always wins; otherwise follow the OS.
      (function () {
        try {
          var stored = localStorage.getItem("skytrace:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked: fall through to the light default */
        }
      })();
    </script>
    <meta
      name="description"
      content="Log the flights you've flown, and watch them draw themselves across the world map."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%88%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
