name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, check, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile` so CI fails on a lockfile that has drifted from
      # package.json, rather than silently resolving something different.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The runnable harnesses: the resolver, the CSV import layer, and the API.
      # The API one boots a Postgres inside the runner, so the database half of
      # the project is covered without a server or a connection string.
      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      # The aviation dataset is ~1.2MB of airport records that must never reach
      # the browser. It is a property of the bundle, so it is checked here
      # rather than trusted.
      - name: Assert the dataset stayed out of the client bundle
        run: |
          if grep -rq "Kotoka International Airport" frontend/dist/assets/*.js; then
            echo "::error::airport dataset leaked into the client bundle"
            exit 1
          fi
          echo "client bundle is free of the airport dataset"

      # `React.lazy` is only a promise about the bundle, and something else can
      # quietly break it: index.html asking the browser to preload the map
      # chunk, or a stylesheet link for it, means every page pays for the map
      # before anything is painted. The landing page is the page that suffers
      # most, since it has no map until well after first paint.
      - name: Assert the map chunk is not on the critical path
        run: |
          if grep -qE 'modulepreload[^>]*map-|stylesheet[^>]*map-' frontend/dist/index.html; then
            echo "::error::the map chunk is preloaded by index.html"
            grep -oE '(modulepreload|stylesheet)[^>]*' frontend/dist/index.html
            exit 1
          fi
          echo "index.html does not preload the map"
